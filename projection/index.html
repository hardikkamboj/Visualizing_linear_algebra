<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Projection onto 2D Plane</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 350px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #0f3460;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #e94560;
        }

        h2 {
            font-size: 1rem;
            margin: 15px 0 10px;
            color: #0f9b8e;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .vector-input {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .vector-input input {
            width: 100%;
            padding: 8px;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            text-align: center;
            font-size: 1rem;
        }

        .vector-input input:focus {
            outline: none;
            border-color: #e94560;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            background: #e94560;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #ff6b6b;
        }

        button.secondary {
            background: #0f9b8e;
        }

        button.secondary:hover {
            background: #12c4b3;
        }

        .info-section {
            background: #1a1a2e;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
        }

        .vector-info {
            font-family: monospace;
            font-size: 0.85rem;
            margin: 5px 0;
        }

        .matrix-display {
            font-family: monospace;
            font-size: 0.8rem;
            background: #0d1525;
            padding: 10px;
            border-radius: 4px;
            margin-top: 8px;
            line-height: 1.6;
        }

        .original-color { color: #ffcc00; }
        .projection-color { color: #00ff88; }
        .error-color { color: #ff6b6b; }
        .plane-color { color: #6b9fff; }

        .legend {
            margin-top: 20px;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 4px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        #info-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.9);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        #graph-legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.9);
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        #graph-legend .legend-item {
            margin: 6px 0;
        }

        #graph-legend .legend-color {
            width: 16px;
            height: 16px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #e94560;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <a href="../" class="back-link">← Back to Home</a>
            <h1>Vector Projection onto 2D Plane</h1>

            <h2>Plane Basis Vectors</h2>
            <div class="input-group">
                <label>Basis Vector a₁ (x, y, z)</label>
                <div class="vector-input">
                    <input type="number" value="1" id="a1x">
                    <input type="number" value="0" id="a1y">
                    <input type="number" value="0" id="a1z">
                </div>
            </div>
            <div class="input-group">
                <label>Basis Vector a₂ (x, y, z)</label>
                <div class="vector-input">
                    <input type="number" value="0" id="a2x">
                    <input type="number" value="1" id="a2y">
                    <input type="number" value="0" id="a2z">
                </div>
            </div>

            <h2>Vector to Project</h2>
            <div class="input-group">
                <label>Vector b (x, y, z)</label>
                <div class="vector-input">
                    <input type="number" value="1" id="bx">
                    <input type="number" value="2" id="by">
                    <input type="number" value="3" id="bz">
                </div>
            </div>

            <button id="project-btn">Project Vector</button>
            <button id="random-plane-btn" class="secondary">Random Plane</button>
            <button id="random-vector-btn" class="secondary">Random Vector</button>

            <div class="info-section">
                <h2 class="original-color">Original Vector b</h2>
                <div id="original-vector" class="vector-info"></div>
            </div>

            <div class="info-section">
                <h2 class="projection-color">Projection p</h2>
                <div id="projection-vector" class="vector-info"></div>
            </div>

            <div class="info-section">
                <h2 class="error-color">Error Vector e = b - p</h2>
                <div id="error-vector" class="vector-info"></div>
                <div id="error-magnitude" class="vector-info" style="margin-top: 5px;"></div>
            </div>

            <div class="info-section">
                <h2>Projection Matrix P</h2>
                <div class="matrix-display" id="projection-matrix"></div>
                <div class="vector-info" style="margin-top: 8px; color: #888; font-size: 0.75rem;">
                    P = A(AᵀA)⁻¹Aᵀ
                </div>
            </div>
        </div>

        <div id="canvas-container">
            <div id="info-overlay">
                Drag to rotate | Scroll to zoom | Right-drag to pan
            </div>
            <div id="graph-legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffcc00;"></div>
                    <span>Original Vector (b)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #00ff88;"></div>
                    <span>Projection (p)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff6b6b;"></div>
                    <span>Error Vector (e)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: rgba(107, 159, 255, 0.5);"></div>
                    <span>2D Plane</span>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // Scene setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(
            75,
            container.clientWidth / container.clientHeight,
            0.1,
            1000
        );
        camera.position.set(5, 5, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Orbit controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.zoomSpeed = 3;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);

        // CSS2D Renderer for labels
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(container.clientWidth, container.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        // Grid and axes
        const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x333333);
        scene.add(gridHelper);

        // Create dark black axes with labels
        function createAxis(start, end, label) {
            const points = [
                new THREE.Vector3(start.x, start.y, start.z),
                new THREE.Vector3(end.x, end.y, end.z)
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 3 });
            const line = new THREE.Line(geometry, material);

            const labelDiv = document.createElement('div');
            labelDiv.className = 'axis-label';
            labelDiv.textContent = label;
            labelDiv.style.color = '#ffffff';
            labelDiv.style.fontSize = '14px';
            labelDiv.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            labelDiv.style.fontWeight = '600';
            labelDiv.style.padding = '2px 6px';
            labelDiv.style.backgroundColor = 'rgba(0, 0, 0, 0.75)';
            labelDiv.style.borderRadius = '3px';
            labelDiv.style.letterSpacing = '0.5px';
            const labelObject = new CSS2DObject(labelDiv);
            labelObject.position.set(end.x * 1.1, end.y * 1.1, end.z * 1.1);
            line.add(labelObject);

            return line;
        }

        const axisLength = 5;
        scene.add(createAxis({x: -axisLength, y: 0, z: 0}, {x: axisLength, y: 0, z: 0}, 'X'));
        scene.add(createAxis({x: 0, y: -axisLength, z: 0}, {x: 0, y: axisLength, z: 0}, 'Y'));
        scene.add(createAxis({x: 0, y: 0, z: -axisLength}, {x: 0, y: 0, z: axisLength}, 'Z'));

        // Group for visualization objects
        let vizGroup = new THREE.Group();
        scene.add(vizGroup);

        // Create arrow helper
        function createArrow(direction, color, origin = [0, 0, 0]) {
            const dir = new THREE.Vector3(direction[0], direction[1], direction[2]);
            const len = dir.length();
            if (len < 0.001) return null;
            dir.normalize();
            const orig = new THREE.Vector3(origin[0], origin[1], origin[2]);
            const arrow = new THREE.ArrowHelper(dir, orig, len, color, 0.15, 0.08);
            return arrow;
        }

        // Create plane from two vectors
        function createPlane(v1, v2, color, opacity = 0.3) {
            const geometry = new THREE.BufferGeometry();
            const size = 4;

            const vertices = new Float32Array([
                -size * (v1[0] + v2[0]), -size * (v1[1] + v2[1]), -size * (v1[2] + v2[2]),
                size * (v1[0] - v2[0]), size * (v1[1] - v2[1]), size * (v1[2] - v2[2]),
                size * (v1[0] + v2[0]), size * (v1[1] + v2[1]), size * (v1[2] + v2[2]),
                -size * (v1[0] - v2[0]), -size * (v1[1] - v2[1]), -size * (v1[2] - v2[2]),
            ]);

            const indices = [0, 1, 2, 0, 2, 3];

            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();

            const material = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            return new THREE.Mesh(geometry, material);
        }

        // Create dashed line
        function createDashedLine(start, end, color) {
            const points = [
                new THREE.Vector3(start[0], start[1], start[2]),
                new THREE.Vector3(end[0], end[1], end[2])
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineDashedMaterial({
                color: color,
                dashSize: 0.1,
                gapSize: 0.05
            });
            const line = new THREE.Line(geometry, material);
            line.computeLineDistances();
            return line;
        }

        // Matrix operations
        function getInputVector(prefix) {
            return [
                parseFloat(document.getElementById(prefix + 'x').value) || 0,
                parseFloat(document.getElementById(prefix + 'y').value) || 0,
                parseFloat(document.getElementById(prefix + 'z').value) || 0
            ];
        }

        function setInputVector(prefix, vec) {
            document.getElementById(prefix + 'x').value = vec[0].toFixed(1);
            document.getElementById(prefix + 'y').value = vec[1].toFixed(1);
            document.getElementById(prefix + 'z').value = vec[2].toFixed(1);
        }

        function dotProduct(a, b) {
            return a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
        }

        function vectorLength(v) {
            return Math.sqrt(dotProduct(v, v));
        }

        function normalizeVector(v) {
            const len = vectorLength(v);
            if (len < 0.0001) return [0, 0, 0];
            return [v[0]/len, v[1]/len, v[2]/len];
        }

        // Compute projection matrix P = A(A^T A)^-1 A^T
        function computeProjectionMatrix(a1, a2) {
            // A is 3x2 matrix with columns a1, a2
            // A^T A is 2x2
            const ata = [
                [dotProduct(a1, a1), dotProduct(a1, a2)],
                [dotProduct(a2, a1), dotProduct(a2, a2)]
            ];

            // Inverse of 2x2 matrix
            const det = ata[0][0] * ata[1][1] - ata[0][1] * ata[1][0];
            if (Math.abs(det) < 0.0001) {
                return null; // Vectors are linearly dependent
            }

            const ataInv = [
                [ata[1][1] / det, -ata[0][1] / det],
                [-ata[1][0] / det, ata[0][0] / det]
            ];

            // P = A * (A^T A)^-1 * A^T
            // P is 3x3
            const P = [];
            for (let i = 0; i < 3; i++) {
                P[i] = [];
                for (let j = 0; j < 3; j++) {
                    // P[i][j] = sum over k,l of A[i][k] * ataInv[k][l] * A[j][l]
                    const A_i = [a1[i], a2[i]]; // row i of A
                    const A_j = [a1[j], a2[j]]; // row j of A

                    let sum = 0;
                    for (let k = 0; k < 2; k++) {
                        for (let l = 0; l < 2; l++) {
                            sum += A_i[k] * ataInv[k][l] * A_j[l];
                        }
                    }
                    P[i][j] = sum;
                }
            }

            return P;
        }

        // Apply projection matrix to vector
        function applyMatrix(P, v) {
            return [
                P[0][0]*v[0] + P[0][1]*v[1] + P[0][2]*v[2],
                P[1][0]*v[0] + P[1][1]*v[1] + P[1][2]*v[2],
                P[2][0]*v[0] + P[2][1]*v[1] + P[2][2]*v[2]
            ];
        }

        function formatVector(v) {
            return `[${v.map(x => x.toFixed(3)).join(', ')}]`;
        }

        function formatMatrix(P) {
            if (!P) return 'Undefined (vectors are linearly dependent)';
            return P.map(row =>
                '│ ' + row.map(x => x.toFixed(3).padStart(7)).join('  ') + ' │'
            ).join('\n');
        }

        function visualize() {
            // Clear previous visualization
            while (vizGroup.children.length > 0) {
                vizGroup.remove(vizGroup.children[0]);
            }

            const a1 = getInputVector('a1');
            const a2 = getInputVector('a2');
            const b = getInputVector('b');

            // Normalize basis vectors for visualization (but use original for computation)
            const a1Norm = normalizeVector(a1);
            const a2Norm = normalizeVector(a2);

            // Compute projection matrix
            const P = computeProjectionMatrix(a1, a2);

            if (!P) {
                document.getElementById('original-vector').textContent = formatVector(b);
                document.getElementById('projection-vector').textContent = 'Error: Basis vectors are linearly dependent';
                document.getElementById('error-vector').textContent = '-';
                document.getElementById('error-magnitude').textContent = '';
                document.getElementById('projection-matrix').textContent = 'Undefined';
                return;
            }

            // Compute projection
            const projection = applyMatrix(P, b);

            // Compute error
            const error = [
                b[0] - projection[0],
                b[1] - projection[1],
                b[2] - projection[2]
            ];
            const errorMag = vectorLength(error);

            // Update UI
            document.getElementById('original-vector').textContent = formatVector(b);
            document.getElementById('projection-vector').textContent = formatVector(projection);
            document.getElementById('error-vector').textContent = formatVector(error);
            document.getElementById('error-magnitude').textContent = `|e| = ${errorMag.toFixed(3)}`;
            document.getElementById('projection-matrix').textContent = formatMatrix(P);

            // Draw plane (using normalized vectors for consistent size)
            vizGroup.add(createPlane(a1Norm, a2Norm, 0x6b9fff, 0.25));

            // Draw basis vectors of plane (small arrows)
            const basisArrow1 = createArrow(a1Norm, 0x6b9fff);
            const basisArrow2 = createArrow(a2Norm, 0x6b9fff);
            if (basisArrow1) vizGroup.add(basisArrow1);
            if (basisArrow2) vizGroup.add(basisArrow2);

            // Draw original vector b (yellow)
            const origArrow = createArrow(b, 0xffcc00);
            if (origArrow) vizGroup.add(origArrow);

            // Draw projection vector (green)
            const projArrow = createArrow(projection, 0x00ff88);
            if (projArrow) vizGroup.add(projArrow);

            // Draw error vector (red) - starts from projection, goes to b
            const errArrow = createArrow(error, 0xff6b6b, projection);
            if (errArrow) vizGroup.add(errArrow);

            // Draw dashed line from origin to projection (to show it's on the plane)
            vizGroup.add(createDashedLine([0, 0, 0], projection, 0x00ff88));
        }

        function randomVector(maxMag = 3) {
            return [
                (Math.random() * 2 - 1) * maxMag,
                (Math.random() * 2 - 1) * maxMag,
                (Math.random() * 2 - 1) * maxMag
            ];
        }

        // Ensure vectors are not parallel
        function randomIndependentVectors() {
            const a1 = randomVector(2);
            let a2 = randomVector(2);

            // Make sure a2 is not parallel to a1
            const cross = [
                a1[1]*a2[2] - a1[2]*a2[1],
                a1[2]*a2[0] - a1[0]*a2[2],
                a1[0]*a2[1] - a1[1]*a2[0]
            ];

            if (vectorLength(cross) < 0.1) {
                // Add some perpendicular component
                a2[0] += 1;
                a2[1] += 0.5;
            }

            return [a1, a2];
        }

        // Event listeners
        document.getElementById('project-btn').addEventListener('click', visualize);

        document.getElementById('random-plane-btn').addEventListener('click', () => {
            const [a1, a2] = randomIndependentVectors();
            setInputVector('a1', a1);
            setInputVector('a2', a2);
            visualize();
        });

        document.getElementById('random-vector-btn').addEventListener('click', () => {
            const b = randomVector(3);
            setInputVector('b', b);
            visualize();
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // Initial visualization
        visualize();
        animate();
    </script>
</body>
</html>
